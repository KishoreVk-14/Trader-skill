services:
  - type: web
    name: gold-smc-monitor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main web --port $PORT --host 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: INITIAL_CAPITAL
        value: "10000.0"
      - key: RISK_PERCENT_PER_TRADE
        value: "1.0"
